name: Release

on:
  push:
    tags:
      - 'v*'
  # Finishes a tag whose run stopped part-way, for example when Maven Central
  # served the artifact after the availability wait gave up.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tag checkout
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Run setup
        run: ./setup.sh

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify documented dependency version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          expected="implementation(\"audio.soniqo:speech:${VERSION}\")"
          readmes=(
            README.md README_zh.md README_ja.md README_ko.md README_es.md
            README_de.md README_fr.md README_hi.md README_pt.md README_ru.md
          )
          for readme in "${readmes[@]}"; do
            if ! grep -Fq "$expected" "$readme"; then
              echo "::error file=${readme}::Expected dependency snippet: ${expected}"
              exit 1
            fi
          done

      - name: Build SDK
        run: ./gradlew :sdk:assembleRelease

      # `test` rather than a variant-specific task: AGP 9 only creates a unit
      # test component for the debug variant, so `testReleaseUnitTest` no
      # longer exists and a tag build died here after the SDK had been built.
      # CI runs `:sdk:test` too, so the release path can no longer name a task
      # that the pull request gate never exercises.
      - name: Run unit tests
        run: ./gradlew :sdk:test :control-demo:testDebugUnitTest

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build signed demo APKs
        run: |
          ./gradlew \
            :app:assembleRelease \
            :control-demo:assembleRelease \
            -PVERSION_NAME=${{ steps.version.outputs.VERSION }} \
            -PVERSION_CODE=${{ github.run_number }}
        env:
          SIGNING_KEYSTORE: /tmp/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # Maven Central refuses a version twice, so a re-run of a tag that is
      # already published skips the upload and goes on to the later steps.
      - name: Check Maven Central for this version
        id: central
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          artifact_url="https://repo1.maven.org/maven2/audio/soniqo/speech/${VERSION}/speech-${VERSION}.pom"
          if curl --fail --silent --output /dev/null "$artifact_url"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "speech ${VERSION} is already on Maven Central; skipping the upload"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        if: steps.central.outputs.published != 'true'
        run: ./gradlew :sdk:publishAndReleaseToMavenCentral --no-configuration-cache -PVERSION_NAME=${{ steps.version.outputs.VERSION }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_SONATYPE_CLOSE_TIMEOUT_SECONDS: 3600

      - name: Verify Maven Central availability
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          artifact_url="https://repo1.maven.org/maven2/audio/soniqo/speech/${VERSION}/speech-${VERSION}.pom"
          # Up to 30 minutes: 0.0.25 took longer than the earlier 10.
          for attempt in {1..120}; do
            if curl --fail --silent --output /dev/null "$artifact_url"; then
              echo "Maven Central artifact is available: ${artifact_url}"
              exit 0
            fi
            echo "Waiting for Maven Central availability (${attempt}/120)..."
            sleep 15
          done
          echo "::error::Maven Central artifact did not become available: ${artifact_url}"
          exit 1

      - name: Publish to GitHub Packages
        run: ./gradlew :sdk:publishAllPublicationsToGitHubPackagesRepository --no-configuration-cache -PVERSION_NAME=${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            sdk/build/outputs/aar/sdk-release.aar
            app/build/outputs/apk/release/app-release.apk
            control-demo/build/outputs/apk/release/control-demo-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
